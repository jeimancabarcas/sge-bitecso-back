name: Deploy Backend Bitecso

on:
  push:
    branches:
      - main # Asegúrate de que sea la rama correcta

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Executing remote ssh commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. Entrar al directorio y limpiar cambios locales para evitar errores de pull
            cd ~/sge-bitecso-back
            git reset --hard origin/main
            git pull origin main

            # 2. Crear el archivo .env desde cero con tus secretos de GitHub
            # Usamos ">" para el primero (sobrescribir) y ">>" para los demás (anexar)
            
            # Database Configuration
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env
            echo "DATABASE_SCHEMA=${{ secrets.DATABASE_SCHEMA }}" >> .env
            echo "DATABASE_SSL=${{ secrets.DATABASE_SSL }}" >> .env

            # JWT Configuration
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}" >> .env

            # Scraper Configuration
            echo "CAPSOLVER_API_KEY=${{ secrets.CAPSOLVER_API_KEY }}" >> .env
            echo "RECAPTCHA_SITE_KEY=${{ secrets.RECAPTCHA_SITE_KEY }}" >> .env
            echo "TARGET_URL=${{ secrets.TARGET_URL }}" >> .env

            # DataImpulse Proxy
            echo "PROXY_HOST=${{ secrets.PROXY_HOST }}" >> .env
            echo "PROXY_PORT=${{ secrets.PROXY_PORT }}" >> .env
            echo "PROXY_USER=${{ secrets.PROXY_USER }}" >> .env
            echo "PROXY_PASS=${{ secrets.PROXY_PASS }}" >> .env

            # 3. Instalación, Construcción y Reinicio de PM2
            npm install
            npm run build
            
            # Reiniciamos el proceso y guardamos para que sobreviva a reinicios del VPS
            pm2 restart rj-api
            pm2 save